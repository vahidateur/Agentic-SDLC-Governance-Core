name: Markdown validation

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: '**/*.md'